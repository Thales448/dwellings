name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: sync
        working-directory: api
        run: uv sync --group dev
      - name: ruff
        working-directory: api
        run: uv run ruff check .
      - name: mypy
        working-directory: api
        run: uv run mypy app
      - name: pytest
        working-directory: api
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: check
        working-directory: web
        run: npm run check
      - name: test
        working-directory: web
        run: npm test
